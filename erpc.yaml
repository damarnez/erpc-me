logLevel: warn

server:
  httpHostV4: "0.0.0.0"
  httpHostV6: "[::]"
  httpPort: 4000
  # Browsers call these endpoints directly (the Pepino interface reads the
  # chains through them), so preflight requests must be answered. Without this
  # every read from a page fails with a CORS error and falls back to the
  # public RPCs.
  cors:
    allowedOrigins: ["*"]
    allowedMethods: ["GET", "POST", "OPTIONS"]
    allowedHeaders: ["Content-Type", "Authorization", "X-ERPC-Secret-Token"]
    exposedHeaders: ["X-Request-ID"]
    allowCredentials: false
    maxAge: 3600

projects:
  - id: main

    upstreams:
      # --- Primary tier -------------------------------------------------------
      # Uncomment and point at your own node. While at least one "tier:primary"
      # upstream is healthy, all traffic goes here and the vendors below are
      # used only as fallback.
      #
      # - id: my-node
      #   endpoint: "${PRIMARY_RPC_URL}"
      #   evm:
      #     chainId: 8453
      #   tags: ["tier:primary"]

      # --- Fallback tier ------------------------------------------------------
      # Vendor shorthand: one API key unlocks every chain the vendor supports.
      # Networks are created lazily on the first request for each chain.
      # Set ALCHEMY_API_KEY and GOLDSKY_SECRET as variables on the Railway service.
      - id: alchemy
        endpoint: "alchemy://${ALCHEMY_API_KEY}"
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      # eRPC's built-in Alchemy chain map does not include Robinhood Chain
      # mainnet (4663) yet, so declare that endpoint explicitly. The testnet
      # (46630) is covered by the alchemy:// shorthand above.
      - id: alchemy-robinhood
        endpoint: "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
        evm:
          chainId: 4663
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      # Goldsky Edge RPC, declared as plain HTTP upstreams per chain.
      # Do NOT use the goldsky:// shorthand on eRPC 0.2.0: its per-chain
      # support probe crashes the whole process with a nil-pointer SIGSEGV
      # (thirdparty/goldsky.go:264 -> common.UniqueUpstreamKey). Explicit
      # endpoints skip that probe. Revisit once a fixed release ships.
      - id: goldsky-base
        endpoint: "https://edge.goldsky.com/standard/evm/8453?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 8453
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      - id: goldsky-base-sepolia
        endpoint: "https://edge.goldsky.com/standard/evm/84532?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 84532
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      - id: goldsky-robinhood
        endpoint: "https://edge.goldsky.com/standard/evm/4663?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 4663
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      - id: goldsky-robinhood-testnet
        endpoint: "https://edge.goldsky.com/standard/evm/46630?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 46630
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

    # Declared networks get an alias, so /main/base works as well as
    # /main/evm/8453. Chains not listed here are still served lazily on
    # first request if a vendor supports them.
    networks:
      - architecture: evm
        evm: { chainId: 8453 }
        alias: base
      - architecture: evm
        evm: { chainId: 84532 }
        alias: base-sepolia
      - architecture: evm
        evm: { chainId: 4663 }
        alias: robinhood
      - architecture: evm
        evm: { chainId: 46630 }
        alias: robinhood-testnet

    networkDefaults:
      failsafe:
        # eth_getLogs is heavy; give it more room and fewer hedges.
        - matchMethod: "eth_getLogs|eth_getBlockReceipts"
          timeout:
            duration: 60s
          retry:
            maxAttempts: 2
            delay: 100ms
        - matchMethod: "*"
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3          # each retry moves to the next upstream
            delay: 50ms
          hedge:
            quantile: 0.7           # fire a backup request at p70 latency
            maxCount: 1
            minDelay: 100ms
            maxDelay: 2s

      selectionPolicy:
        evalInterval: 15s
        evalFunc: |
          (upstreams, ctx) =>
            upstreams
              .removeCordoned()
              .excludeIf(all(samplesAbove(10), errorRateAbove(0.7)))
              .excludeIf(all(samplesAbove(10), throttleRateAbove(0.4)))
              // Use primary upstreams while at least one is healthy;
              // otherwise open the pool to the fallback vendors.
              .preferTag('tier:primary', { minHealthy: 1, fallback: 'tier:fallback' })
              .sortByScore(PREFER_FASTEST)
              .stickyPrimary({ hysteresis: 0.30, minSwitchInterval: '30s' })
              .probeExcluded({ sampleRate: 0.1, minSamples: 10, timeout: '10s' })
