logLevel: warn

server:
  httpHostV4: "0.0.0.0"
  httpHostV6: "[::]"
  httpPort: 4000

projects:
  - id: main

    # Browsers call these endpoints directly (the Pepino interface reads the
    # chains through them), so preflight requests must be answered. Without
    # this every read from a page fails with a CORS error and falls back to the
    # public RPCs. In eRPC 0.2.0 CORS is configured per project, not under
    # `server`.
    cors:
      allowedOrigins: ["*"]
      allowedMethods: ["GET", "POST", "OPTIONS"]
      allowedHeaders: ["Content-Type", "Authorization", "X-ERPC-Secret-Token"]
      exposedHeaders: ["X-Request-ID"]
      allowCredentials: false
      maxAge: 3600

    upstreams:
      # --- Primary tier -------------------------------------------------------
      # Uncomment and point at your own node. While at least one "tier:primary"
      # upstream is healthy, all traffic goes here and the vendor and public
      # tiers below are used only as fallback.
      #
      # - id: my-node
      #   endpoint: "${PRIMARY_RPC_URL}"
      #   evm:
      #     chainId: 8453
      #   tags: ["tier:primary"]

      # --- Fallback tier ------------------------------------------------------
      # Vendor shorthand: one API key unlocks every chain the vendor supports.
      # Networks are created lazily on the first request for each chain.
      # Set ALCHEMY_API_KEY and GOLDSKY_SECRET as variables on the Railway service.
      - id: alchemy
        endpoint: "alchemy://${ALCHEMY_API_KEY}"
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      # eRPC's built-in Alchemy chain map does not include Robinhood Chain
      # mainnet (4663) yet, so declare that endpoint explicitly. The testnet
      # (46630) is covered by the alchemy:// shorthand above.
      - id: alchemy-robinhood
        endpoint: "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
        evm:
          chainId: 4663
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      # Goldsky Edge RPC, declared as plain HTTP upstreams per chain.
      # Do NOT use the goldsky:// shorthand on eRPC 0.2.0: its per-chain
      # support probe crashes the whole process with a nil-pointer SIGSEGV
      # (thirdparty/goldsky.go:264 -> common.UniqueUpstreamKey). Explicit
      # endpoints skip that probe. Revisit once a fixed release ships.
      - id: goldsky-base
        endpoint: "https://edge.goldsky.com/standard/evm/8453?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 8453
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      - id: goldsky-base-sepolia
        endpoint: "https://edge.goldsky.com/standard/evm/84532?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 84532
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      - id: goldsky-robinhood
        endpoint: "https://edge.goldsky.com/standard/evm/4663?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 4663
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      - id: goldsky-robinhood-testnet
        endpoint: "https://edge.goldsky.com/standard/evm/46630?secret=${GOLDSKY_SECRET}"
        evm:
          chainId: 46630
        tags: ["tier:fallback"]
        routing:
          scoreMultipliers:
            - overall: 0.1

      # --- Public tier --------------------------------------------------------
      # Keyless public RPCs, used only as a last resort. They stay in the pool
      # so a request that fails on every vendor can still retry here, but the
      # low score multiplier keeps them ranked behind Alchemy and Goldsky.
      # Endpoints come from the official chain registry (chainid.network) and
      # were checked with eth_chainId before being added.
      - id: public-base
        endpoint: "https://mainnet.base.org"
        evm:
          chainId: 8453
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-base-publicnode
        endpoint: "https://base-rpc.publicnode.com"
        evm:
          chainId: 8453
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-base-sepolia
        endpoint: "https://sepolia.base.org"
        evm:
          chainId: 84532
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-base-sepolia-publicnode
        endpoint: "https://base-sepolia-rpc.publicnode.com"
        evm:
          chainId: 84532
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-robinhood
        endpoint: "https://rpc.mainnet.chain.robinhood.com"
        evm:
          chainId: 4663
          # Robinhood's own RPC answers eth_syncing with -32601 (method not
          # found), which makes eRPC's state poller fail its bootstrap on
          # every start. Treat the node as always synced instead.
          skipSyncingCheck: true
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-robinhood-publicnode
        endpoint: "https://robinhood-rpc.publicnode.com"
        evm:
          chainId: 4663
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-robinhood-testnet
        endpoint: "https://rpc.testnet.chain.robinhood.com/rpc"
        evm:
          chainId: 46630
          # Robinhood's own RPC answers eth_syncing with -32601 (method not
          # found), which makes eRPC's state poller fail its bootstrap on
          # every start. Treat the node as always synced instead.
          skipSyncingCheck: true
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

      - id: public-robinhood-testnet-publicnode
        endpoint: "https://robinhood-sepolia-rpc.publicnode.com"
        evm:
          chainId: 46630
        tags: ["tier:public"]
        routing:
          scoreMultipliers:
            - overall: 0.02

    # Declared networks get an alias, so /main/base works as well as
    # /main/evm/8453. Chains not listed here are still served lazily on
    # first request if a vendor supports them.
    networks:
      - architecture: evm
        evm: { chainId: 8453 }
        alias: base
      - architecture: evm
        evm: { chainId: 84532 }
        alias: base-sepolia
      - architecture: evm
        evm: { chainId: 4663 }
        alias: robinhood
      - architecture: evm
        evm: { chainId: 46630 }
        alias: robinhood-testnet

    networkDefaults:
      failsafe:
        # eth_getLogs is heavy; give it more room and fewer hedges.
        - matchMethod: "eth_getLogs|eth_getBlockReceipts"
          timeout:
            duration: 60s
          retry:
            maxAttempts: 2
            delay: 100ms
        - matchMethod: "*"
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3          # each retry moves to the next upstream
            delay: 50ms
          hedge:
            quantile: 0.7           # fire a backup request at p70 latency
            maxCount: 1
            minDelay: 100ms
            maxDelay: 2s

      selectionPolicy:
        evalInterval: 15s
        evalFunc: |
          (upstreams, ctx) =>
            upstreams
              .removeCordoned()
              .excludeIf(all(samplesAbove(10), errorRateAbove(0.7)))
              .excludeIf(all(samplesAbove(10), throttleRateAbove(0.4)))
              // Use primary upstreams while at least one is healthy;
              // otherwise open the pool to the fallback vendors plus the
              // public tier. sortByScore ranks public last (overall: 0.02),
              // so it only serves retries and hedges the vendors miss.
              .preferTag('tier:primary', { minHealthy: 1, fallback: ['tier:fallback', 'tier:public'] })
              .sortByScore(PREFER_FASTEST)
              .stickyPrimary({ hysteresis: 0.30, minSwitchInterval: '30s' })
              .probeExcluded({ sampleRate: 0.1, minSamples: 10, timeout: '10s' })
